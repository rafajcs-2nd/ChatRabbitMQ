syntax = "proto3";

package ChatRabbitMQ; //pasta alterar!

option java_package = "br.ufs.dcomp.ChatRabbitMQ";  //caminho do arquivo - alterar!
option java_outer_classname = "MensagemProto";

message Mensagem{
     string emissor = 1; 
     string data = 2; 
     string hora = 3; 
     string grupo = 4;
     Conteudo conteudo = 5;
}

message Conteudo{
     string tipo = 1;
     bytes corpo = 2; 
     string nome = 3; 
}